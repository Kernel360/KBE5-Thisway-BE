events {}
http {
  access_log off;
  server {
    listen 8080;
    location = /loki/api/v1/push {
      limit_except POST { deny all; }
      auth_basic "log-writer";
      auth_basic_user_file /run/secrets/writer;
      proxy_pass http://loki:3100;
    }
    location = /loki/api/v1/query_range {
      limit_except GET { deny all; }
      auth_basic "log-reader";
      auth_basic_user_file /run/secrets/reader;
      proxy_pass http://loki:3100;
    }
    location / { return 403; }
  }
}
