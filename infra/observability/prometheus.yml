global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/rules/thisway.yml]
scrape_configs:
  - job_name: spring-boot-application
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [host.docker.internal:8080]
  - job_name: RabbitMQ
    static_configs:
      - targets: [host.docker.internal:15692]
