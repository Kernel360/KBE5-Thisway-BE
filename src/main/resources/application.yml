spring.application.name: thisway

spring:
  profiles:
    active:
      - ${SPRING_PROFILES_ACTIVE:dev}


# Only bounded endpoint templates/status/method labels; no tenant/device/trace labels.
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s

# Empty means all Prometheus requests are denied. Store only the digest on the application.
thisway.metrics.token-sha256: ${THISWAY_METRICS_TOKEN_SHA256:}
